[project]
name = "clausecheck"
version = "0.1.0"
description = "Contract compliance checker against golden rules (learning project)"
requires-python = ">=3.12"
dependencies = [
    "anthropic",
    "elasticsearch>=9,<10",
    "fastapi>=0.162.5",
    "httpx>=0.28.1",
    "langgraph>=1.2.20",
    "langgraph-checkpoint-sqlite>=3.1.3",
    "mcp>=2.3.0,<3",  # 2.x renamed FastMCP → MCPServer; pin the major version
    "opentelemetry-sdk>=1.45.2",
    "pydantic>=2",
    "python-dotenv",
    "pyyaml>=6.0.3",
    "tabulate>=0.10.0",
]

# Heavy ML stack (embeddings, local models, fine-tuning): installed locally by default, skipped in CI, where the
# $0 tests never import it (the code loads these libraries lazily, inside functions).
[dependency-groups]
dev = ["pytest>=9.2.0"]
ml = [
    "accelerate>=1.15.0",
    "bitsandbytes>=0.50.2",
    "datasets>=5.2.0",
    "gguf>=0.19.0",
    "pandas>=3.1.1",
    "peft>=0.21.2",
    "scikit-learn>=1.9.1",
    "sentence-transformers>=6.2.0",
    "torch>=2.14.1",
]

[tool.uv]
default-groups = ["dev", "ml"]

# GPU build of PyTorch (CUDA 12.6) for fine-tuning and faster embeddings; PyPI's Windows wheel is CPU-only.
[tool.uv.sources]
torch = [{ index = "pytorch-cu126" }]

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clausecheck"]
